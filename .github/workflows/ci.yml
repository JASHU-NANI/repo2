
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Compile Java (FAILS: syntax error)"
        run: |
          cat > Hello.java <<'EOF'
          public class Hello {
              public static void main(String[] args) {
                  System.out.println("Hello"   // missing parenthesis and semicolon
              }
          }
          EOF
          javac Hello.java

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Run Node test (FAILS: assertion error)"
        run: |
          node -e "
          const assert = require('assert');
          function total(items) { return items.reduce((a, b) => a + b, 0); }
          assert.strictEqual(total([1, 2, 3]), 7, 'cart total is wrong');
          "

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Check deploy config (FAILS: missing secret)"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN is not configured for this repository"
            exit 1
          fi