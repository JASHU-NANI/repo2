
name: Notify AI Agent

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}   # no GITHUB_TOKEN permissions needed

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger central AI agent
        env:
          AGENT_REPO: ${{ vars.AI_AGENT_REPO }}                  # e.g. my-org/AI-DevOps-Agent
          DISPATCH_TOKEN: ${{ secrets.AI_AGENT_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          payload=$(jq -n --arg repo "$TARGET_REPO" --arg run "$TARGET_RUN_ID" \
            '{ref: "main", inputs: {repository: $repo, run_id: $run}}')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${AGENT_REPO}/actions/workflows/ai-devops-agent.yml/dispatches" \
            -d "$payload"
          echo "Notified agent: $TARGET_REPO run $TARGET_RUN_ID"
